plugins {
    id 'java-library'
    id 'com.vanniktech.maven.publish' version '0.34.0'
    id 'com.diffplug.spotless' version '7.2.1'
}

group = 'io.github.v1as'
version = '0.0.6'

java {
    sourceCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

ext {
    lombokVersion = '1.18.34'
}

dependencies {
    compileOnly 'org.slf4j:slf4j-api:2.0.16'
    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"
    testCompileOnly "org.projectlombok:lombok:$lombokVersion"
    testAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'ch.qos.logback:logback-classic:1.5.8'
    testImplementation 'org.awaitility:awaitility:4.2.0'
}

test {
    useJUnitPlatform()
}

spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat('1.22.0').aosp().reflowLongStrings().skipJavadocFormatting()
        formatAnnotations()
    }
}

mavenPublishing {
    publishToMavenCentral()
    signAllPublications()

    coordinates(project.group.toString(), 'handletility', project.version.toString())

    pom {
        name = 'handletility'
        description = 'Handlers and processors with a uniform DONE / SKIPPED / ERROR result model'
        inceptionYear = '2024'
        url = 'https://github.com/v1as/handletility'
        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }
        developers {
            developer {
                id = 'v1as'
                name = 'v1as'
                url = 'https://github.com/v1as'
            }
        }
        scm {
            url = 'https://github.com/v1as/handletility'
            connection = 'scm:git:git://github.com/v1as/handletility.git'
            developerConnection = 'scm:git:ssh://git@github.com/v1as/handletility.git'
        }
    }
}
